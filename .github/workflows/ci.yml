name: CI

# The same checks as .gitlab-ci.yml, in the public image of https://github.com/armint/firmware-build-image.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GCC_TOOLCHAIN_PREFIX: /opt/xpack-riscv-none-elf-gcc-15.2.0-1

jobs:
  # Builds the OBJECT library standalone for each family. Device macro, -march and -mabi are the values of
  # docs/building.md. At C++23 hw::span is std::span, at C++17 it is span_compat::span.
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/armint/firmware-build-image:v1.15.0
    strategy:
      fail-fast: false
      matrix:
        std: [23, 17]
        include:
          - { family: CH32V00X, flags: "-DCH32V003 -march=rv32ec_zicsr_zifencei -mabi=ilp32e" }
          # CH32V006 compiles the V006 ADC driver, which CH32V003 does not.
          - { family: CH32V00X, flags: "-DCH32V006 -march=rv32ec_zicsr_zifencei_zmmul -mabi=ilp32e" }
          - { family: CH32V20X, flags: "-DCH32V20x_D8W -march=rv32imac_zicsr_zifencei -mabi=ilp32" }
          - { family: CH32V30X, flags: "-DCH32V30x_D8C -march=rv32imafc_zicsr_zifencei -mabi=ilp32f" }
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          cmake -B build -G "Unix Makefiles" \
            -D CMAKE_TOOLCHAIN_FILE=cmake/gcc_riscv.cmake \
            -D GCC_TOOLCHAIN_PREFIX="$GCC_TOOLCHAIN_PREFIX" \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_CXX_STANDARD=${{ matrix.std }} \
            -D CH32_FAMILY=${{ matrix.family }} \
            -D "CMAKE_C_FLAGS=${{ matrix.flags }}" \
            -D "CMAKE_CXX_FLAGS=${{ matrix.flags }}"
      - name: Build
        run: cmake --build build --target ch32v00x-system -j"$(nproc)"
      - name: Check the C++ standard and the span type
        run: |
          flags=build/CMakeFiles/ch32v00x-system.dir/flags.make
          grep -q -- "-std=gnu++${{ matrix.std }}" "$flags" || { echo "not built at C++${{ matrix.std }}"; exit 1; }
          if [ "${{ matrix.std }}" = 23 ]; then
            if grep -q CH32V00X_SYSTEM_USE_SPAN_COMPAT "$flags" || [ -e build/_deps/span_compat-src ]; then
              echo "C++23 build uses span-compat"; exit 1
            fi
          else
            grep -q CH32V00X_SYSTEM_USE_SPAN_COMPAT "$flags" || { echo "span-compat path not taken"; exit 1; }
            grep -q SPAN_COMPAT_USE_STD_SPAN=0 "$flags" || { echo "span-compat not set to its own span"; exit 1; }
          fi

  # Host unit tests (tests/host): fake registers, no RISC-V toolchain.
  host-tests:
    runs-on: ubuntu-latest
    container: ghcr.io/armint/firmware-build-image:v1.15.0
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S tests/host -B build-host -G "Unix Makefiles"
      - run: cmake --build build-host -j"$(nproc)"
      - run: ctest --test-dir build-host --output-on-failure

  # Links the CH32V307 test image and checks the vector table: Reset_Handler at 0x0, g_pfnVectors at 0x4.
  build-v307-test-image:
    runs-on: ubuntu-latest
    container: ghcr.io/armint/firmware-build-image:v1.15.0
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          flags="-DCH32V30x_D8C -march=rv32imafc_zicsr_zifencei -mabi=ilp32f"
          cmake -B build -G "Unix Makefiles" \
            -D CMAKE_TOOLCHAIN_FILE=cmake/gcc_riscv.cmake \
            -D GCC_TOOLCHAIN_PREFIX="$GCC_TOOLCHAIN_PREFIX" \
            -D CMAKE_BUILD_TYPE=Release -D CMAKE_CXX_STANDARD=23 \
            -D CH32_FAMILY=CH32V30X -D CH32V00X_SYSTEM_BUILD_TEST_IMAGE=ON \
            -D "CMAKE_C_FLAGS=$flags" -D "CMAKE_CXX_FLAGS=$flags"
          cmake --build build --target test-image-v307 -j"$(nproc)"
      - name: Check the vector table
        run: |
          NM="$GCC_TOOLCHAIN_PREFIX/bin/riscv-none-elf-nm"
          elf=build/tests/ch32v30x/test-image-v307
          vectors=$("$NM" "$elf" | awk '$3 == "g_pfnVectors" {print $1}')
          reset=$("$NM" "$elf" | awk '$3 == "Reset_Handler" {print $1}')
          [ "$vectors" = 00000004 ] || { echo "g_pfnVectors at '$vectors', expected 00000004"; exit 1; }
          [ "$reset" = 00000000 ] || { echo "Reset_Handler at '$reset', expected 00000000"; exit 1; }
